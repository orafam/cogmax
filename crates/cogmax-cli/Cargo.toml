[package]
name = "cogmax-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
cogmax-api = { path = "../cogmax-api" }
cogmax-core = { path = "../cogmax-core" }
cogmax-discovery = { path = "../cogmax-discovery" }
cogmax-domain = { path = "../cogmax-domain" }
cogmax-storage = { path = "../cogmax-storage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
sha2 = "0.10"

[[bin]]
name = "cogmax"
path = "src/main.rs"
