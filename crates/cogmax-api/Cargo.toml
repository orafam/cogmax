[package]
name = "cogmax-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
cogmax-core = { path = "../cogmax-core" }
cogmax-domain = { path = "../cogmax-domain" }
cogmax-storage = { path = "../cogmax-storage" }
tower = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
